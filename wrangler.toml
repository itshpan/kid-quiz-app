name = "learning-lab"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# ---------------------------------------------------------------------------
# Progress syncing (Cloudflare D1).
#
# The binding lives here rather than in the dashboard: this project deploys
# with `wrangler pages deploy`, and once a wrangler.toml is present Cloudflare
# manages the project's bindings from it and greys out the dashboard control.
#
# Database and schema were created in the D1 console; db/setup.sql is the
# copy of record. If the binding is ever removed, /api/* returns
# "not-configured" and the app falls back to local storage cleanly.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "learning-lab"
database_id = "a874fd40-c274-43fc-82f4-2b58baa0bd5a"
