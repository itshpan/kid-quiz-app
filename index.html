<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Learning Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <script>
        /* Apply the saved theme before first paint so there's no flash. */
        try {
            var t = localStorage.getItem('learningLab_theme');
            if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
            var s = localStorage.getItem('learningLab_textScale');
            var m = { small:.9, normal:1, large:1.15, huge:1.32 };
            if (s && m[s]) document.documentElement.style.setProperty('--scale', m[s]);
        } catch (e) {}
    </script>
</head>
<body>
    <main class="page" id="catalogPage"></main>
    <script type="module" src="assets/js/catalog.js"></script>
</body>
</html>
